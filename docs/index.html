<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'rab Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'arabic': ['Amiri', 'serif'],
                        'sans': ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#8b5cf6', // Violet 500
                        accent: '#ec4899', // Pink 500
                        dark: '#0f172a', // Slate 900
                        surface: '#1e293b', // Slate 800
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: white;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .arabic-text {
            direction: rtl;
            line-height: 2;
        }

        /* Custom Scrollbar for the drawer content */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="font-sans overflow-hidden flex flex-col h-screen">

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-start pt-12 px-4 relative z-10">

        <!-- Header / Title -->
        <div class="text-center mb-8 animate-fade-in-down">
            <h1 class="text-xl text-slate-400 tracking-widest uppercase mb-2">Contoh I'rab</h1>
            <div class="w-16 h-1 bg-gradient-to-r from-primary to-accent mx-auto rounded-full"></div>
        </div>

        <!-- Main Sentence Card -->
        <div
            class="w-full max-w-2xl glass-panel rounded-2xl p-8 mb-6 text-center shadow-2xl transform hover:scale-[1.02] transition-transform duration-300">
            <h2
                class="font-arabic text-5xl md:text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-br from-white to-slate-300 leading-relaxed py-2">
                <!-- Arabic text will be loaded here -->
            </h2>
            <p class="text-lg text-slate-400 font-light tracking-wide"><!-- Transliteration will be loaded here --></p>
        </div>

    </main>

    <!-- Drawer / Bottom Sheet -->
    <div class="relative z-20 w-full max-w-3xl mx-auto flex-1 flex flex-col min-h-0">
        <!-- Drawer Handle/Header -->
        <div class="glass-panel rounded-t-3xl border-b-0 flex flex-col flex-1 shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
            <div class="w-full flex justify-center pt-4 pb-2">
                <div class="w-12 h-1.5 bg-slate-600 rounded-full opacity-50"></div>
            </div>

            <div class="px-6 pb-4 border-b border-slate-700/50">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <span class="text-accent">✨</span> Analisis I'rab
                </h3>
            </div>

            <!-- Scrollable Content -->
            <div id="drawer-content" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                <!-- Content will be loaded here -->
                <div class="flex items-center justify-center h-full text-slate-400 animate-pulse">
                    Memuat data...
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 z-50 p-4 bg-gradient-to-t from-slate-900 via-slate-900/90 to-transparent">
        <div class="max-w-3xl mx-auto flex gap-4">
            <button
                class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-4 rounded-xl shadow-lg border border-slate-700 transition-all active:scale-95 flex items-center justify-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Kembali
            </button>
            <button
                class="flex-1 bg-gradient-to-r from-primary to-secondary hover:from-primary/90 hover:to-secondary/90 text-white font-semibold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all active:scale-95 flex items-center justify-center gap-2 group">
                Lanjut
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 transform group-hover:translate-x-1 transition-transform" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('datas/sample_1.json');
                if (!response.ok) throw new Error('Gagal memuat data');
                const data = await response.json();
                renderData(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('drawer-content').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-red-400 text-center">
                        <p>Gagal memuat data.</p>
                        <p class="text-sm text-slate-500 mt-2">Pastikan Anda menjalankan file ini melalui server lokal (http://...), bukan file langsung (file://...).</p>
                    </div>
                `;
            }
        }

        function renderData(data) {
            // Update Main Title
            const mainTitle = document.querySelector('h2');
            const subTitle = document.querySelector('p.text-lg');

            if (mainTitle) mainTitle.textContent = data.arabic;
            if (subTitle) subTitle.textContent = data.transliteration;

            // Render Analysis
            const container = document.getElementById('drawer-content');
            container.innerHTML = ''; // Clear loading state

            data.analysis.forEach((item, index) => {
                const itemHtml = `
                <div class="group animate-fade-in-up" style="animation-delay: ${index * 100}ms">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-full bg-${index % 2 === 0 ? 'primary' : 'accent'}/20 flex items-center justify-center text-${index % 2 === 0 ? 'primary' : 'accent'} font-bold text-xl border border-${index % 2 === 0 ? 'primary' : 'accent'}/30 shrink-0">
                            ${item.id}
                        </div>
                        <div class="flex-1">
                            <h4 class="font-arabic text-3xl font-bold text-white mb-2 text-right dir-rtl">${item.word}</h4>
                            
                            <div class="space-y-3">
                                ${item.details.map(detail => `
                                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 hover:border-${index % 2 === 0 ? 'primary' : 'accent'}/50 transition-colors">
                                    <span class="text-xs font-bold text-${index % 2 === 0 ? 'primary' : 'accent'} uppercase tracking-wider block mb-1">${detail.label}</span>
                                    <p class="font-arabic text-xl text-slate-200 text-right dir-rtl ${detail.value.length > 50 ? 'leading-loose' : ''}">${detail.value}</p>
                                </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
                ${index < data.analysis.length - 1 ? '<div class="w-full h-px bg-gradient-to-r from-transparent via-slate-700 to-transparent my-4"></div>' : ''}
                `;
                container.insertAdjacentHTML('beforeend', itemHtml);
            });

            // Add spacer
            container.insertAdjacentHTML('beforeend', '<div class="h-20"></div>');
        }

        // Add simple fade-in animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.5s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

        // Init
        loadData();
    </script>
</body>

</html>
